<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 68 68"
  role="img"
  aria-labelledby="fanout-mark-title fanout-mark-description"
>
  <title id="fanout-mark-title">Fanout</title>
  <desc id="fanout-mark-description">One isometric node branching to three nodes.</desc>
  <style>
    .connector-lines {
      fill: none;
      stroke: #272727;
      stroke-dasharray: 2.8 3.8;
      stroke-linecap: round;
      stroke-width: 1.6;
      opacity: 0.36;
    }

    .connector-junction {
      fill: #272727;
      opacity: 0.36;
    }

    .node {
      stroke: #272727;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.35;
    }

    .face-top {
      fill: #ffffff;
    }

    .face-left {
      fill: #f7f7f8;
    }

    .face-right {
      fill: #f4f4f5;
    }

    .status {
      fill: #0f9d58;
      stroke: #ffffff;
      stroke-width: 0.85;
    }

    .origin {
      fill: #6e6e6e;
    }

    @media (prefers-color-scheme: dark) {
      .connector-lines {
        stroke: #f2f4f7;
      }

      .connector-junction {
        fill: #f2f4f7;
      }

      .node {
        stroke: #f2f4f7;
      }

      .face-top,
      .face-left,
      .face-right {
        stroke: #f2f4f7;
      }

      .face-top {
        fill: #191a1c;
      }

      .face-left {
        fill: #111213;
      }

      .face-right {
        fill: #202123;
      }

      .status {
        fill: #4ed08a;
        stroke: #191a1c;
      }

      .origin {
        fill: #a9b0ba;
      }
    }
  </style>

